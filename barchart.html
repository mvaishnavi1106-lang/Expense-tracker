<!DOCTYPE html>
<html>
<head>
    <title>Monthly Expense Bar Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1>Monthly Expense Chart</h1>

        <!-- Responsive Chart Container -->
        <div style="max-width:800px; margin:auto; height:400px;">
            <canvas id="expenseBarChart"></canvas>
        </div>

        <br>
        <a href="/" class="btn btn-secondary mt-3">Back to Dashboard</a>
    </div>

    <script>
        const labels = {{ bar_data | map(attribute=0) | list | tojson }};
        const dataValues = {{ bar_data | map(attribute=1) | list | tojson }};

        const data = {
            labels: labels,
            datasets: [{
                label: 'Monthly Expenses',
                data: dataValues,
                backgroundColor: 'rgba(54, 162, 235, 0.6)'
            }]
        };

        const config = {
            type: 'bar',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        };

        new Chart(
            document.getElementById('expenseBarChart'),
            config
        );
    </script>
</body>
</html>
