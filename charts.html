<!DOCTYPE html>
<html>
<head>
    <title>Expense Pie Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1>Expense Distribution by Category</h1>

        <!-- Responsive Chart Container -->
        <div style="max-width:800px; margin:auto; height:400px;">
            <canvas id="expensePieChart"></canvas>
        </div>

        <br>
        <a href="/" class="btn btn-secondary mt-3">Back to Dashboard</a>
    </div>

    <script>
        const labels = {{ chart_data | map(attribute=0) | list | tojson }};
        const dataValues = {{ chart_data | map(attribute=1) | list | tojson }};

        const data = {
            labels: labels,
            datasets: [{
                data: dataValues,
                backgroundColor: [
                    'rgba(255, 99, 132, 0.6)',
                    'rgba(54, 162, 235, 0.6)',
                    'rgba(255, 206, 86, 0.6)',
                    'rgba(75, 192, 192, 0.6)',
                    'rgba(153, 102, 255, 0.6)'
                ]
            }]
        };

        const config = {
            type: 'pie',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        };

        new Chart(
            document.getElementById('expensePieChart'),
            config
        );
    </script>
</body>
</html>
