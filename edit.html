<!DOCTYPE html>
<html>

<head>
    <title>Edit Expense</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f9;
        }

        h1 {
            color: #333;
        }

        form {
            margin-top: 20px;
        }

        input,
        button {
            padding: 8px;
            margin: 5px;
        }

        a {
            text-decoration: none;
            color: blue;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>Edit Expense</h1>

    <form method="POST">
        <input type="text" name="title" value="{{ expense[1] }}" required>
        <input type="number" step="0.01" name="amount" value="{{ expense[2] }}" required>
        <input type="text" name="category" value="{{ expense[3] }}">
        <input type="date" name="date" value="{{ expense[4] }}">
        <button type="submit">Update Expense</button>
    </form>

    <br>
    <a href="/">⬅ Back to Expenses</a>
</body>

</html>
